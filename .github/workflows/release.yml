name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual runs build every target without publishing anything, so a
  # toolchain change can be verified before it rides on a real tag.
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: zx_go-linux-amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            artifact: zx_go-linux-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact: zx_go-windows-amd64.exe
          # Experimental: native Windows-on-ARM. Non-blocking
          # (continue-on-error) so it can never fail the release or cancel the
          # other targets.
          #
          # It needs llvm-mingw rather than the runner's stock clang. go-gl's
          # build.go puts glfw's bundled mingw headers on the include path for
          # every Windows build ("#cgo windows CFLAGS: ... -Iglfw/deps/mingw"),
          # so <xinput.h> resolves to a header that uses WINBOOL — a mingw-w64
          # typedef the MSVC SDK does not have. An MSVC-targeting clang then
          # reads "XInputEnable(WINBOOL)" as an untyped parameter and stops.
          # cgo wants a GCC-compatible toolchain on Windows regardless, so the
          # fix is to give it one rather than to define the missing symbol.
          - os: windows-11-arm
            goos: windows
            goarch: arm64
            cc: aarch64-w64-mingw32-clang
            llvm_mingw: true
            experimental: true
            artifact: zx_go-windows-arm64.exe
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact: zx_go-macos-arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            cc: "clang -arch x86_64"
            artifact: zx_go-macos-amd64

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install Linux dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev

      # Pinned rather than tracking latest: a release build should not change
      # underneath a tag. Bump the version deliberately.
      - name: Install llvm-mingw (Windows ARM64)
        if: matrix.llvm_mingw
        shell: pwsh
        run: |
          $ver = '20260616'
          $name = "llvm-mingw-$ver-ucrt-aarch64"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/$name.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\llvm-mingw.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\llvm-mingw.zip" -DestinationPath $env:RUNNER_TEMP -Force
          $bin = "$env:RUNNER_TEMP\$name\bin"
          if (-not (Test-Path "$bin\aarch64-w64-mingw32-clang.exe")) {
            Get-ChildItem $bin -Filter "*clang*" | Select-Object -First 20 -ExpandProperty Name
            throw "aarch64-w64-mingw32-clang not found in $bin"
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.cc || '' }}
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go build -ldflags "-X github.com/conorarmstrong/zx_go/pkg/version.BuildDate=$BUILD_DATE" \
            -o ${{ matrix.artifact }} ./cmd/zx_go

      - name: Package binary (Unix)
        if: matrix.goos != 'windows'
        shell: bash
        run: |
          chmod +x ${{ matrix.artifact }}
          tar czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}

      - name: Package binary (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path ${{ matrix.artifact }} -DestinationPath ${{ matrix.artifact }}.zip

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
