name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: zx_go-linux-amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact: zx_go-windows-amd64.exe
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact: zx_go-macos-arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            cc: "clang -arch x86_64"
            artifact: zx_go-macos-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Install Linux dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.cc || '' }}
        run: go build -o ${{ matrix.artifact }} ./cmd/zx_go

      - name: Set executable permission
        if: matrix.goos != 'windows'
        run: chmod +x ${{ matrix.artifact }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
